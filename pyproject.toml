[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsewatch"
version = "0.1.0"
description = "Change-detection monitor for web pages and JSON endpoints: conditional fetches, token-level diffing, cooldown rules and webhook/Telegram alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suprit U", email = "supritu4@gmail.com" }]
keywords = ["monitoring", "change-detection", "alerting", "web-scraping", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
pulsewatch = "pulsewatch.cli:main"
pulsewatch-server = "pulsewatch.server:main"

[project.urls]
Homepage = "https://github.com/Suprit-U/PulseWatch"
Source = "https://github.com/Suprit-U/PulseWatch"
Issues = "https://github.com/Suprit-U/PulseWatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]